name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: mkdir -p artifacts
      - run: dotnet build Jellyfin.Plugin.GlideToolkit/Jellyfin.Plugin.GlideToolkit.csproj -c Release
      - run: dotnet run --project GlideToolkit.Tests/GlideToolkit.Tests.csproj -c Release -- test-media/original.mp4 artifacts/core-report.json
      - run: python3 scripts/package.py
      - run: python3 scripts/verify_repository.py --local
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: toolkit-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Jellyfin.Plugin.GlideToolkit/Jellyfin.Plugin.GlideToolkit.csproj -c Release
      - run: python3 scripts/package.py
      - name: Publish immutable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p artifacts/existing
            gh release download "$GITHUB_REF_NAME" --pattern '*.zip' --dir artifacts/existing
            python3 -c "from pathlib import Path; a=list(Path('artifacts').glob('*.zip')); b=list(Path('artifacts/existing').glob('*.zip')); assert len(a)==len(b)==1 and a[0].read_bytes()==b[0].read_bytes(), 'Published assets cannot be changed'"
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/SHA256SUMS --verify-tag --title "Glide Toolkit $GITHUB_REF_NAME · Jellyfin 12.2" --notes-file CHANGELOG.md
          fi
      - name: Register available release
        run: |
          git switch main
          git pull --ff-only origin main
          python3 scripts/package.py --register
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Register ${GITHUB_REF_NAME} in the Jellyfin catalog"
            git push origin main
          fi
